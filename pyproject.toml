[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manim-media-studio"
version = "1.0.0"
description = "Frame-accurate Manim overlays for images and videos"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
dependencies = [
  "PySide6>=6.7,<7",
  "manim>=0.19,<0.20",
  "opencv-contrib-python>=4.10,<5",
  "platformdirs>=4.2,<5",
]

[project.scripts]
manim-media-studio = "manim_media_studio.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
